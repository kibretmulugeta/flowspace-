name: Mobile Devices Build (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android Release (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://flowspace-api.onrender.com/api/v1' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wltzqzmretyxbanmqjpa.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_4Mz3KRV6is5_R8edMVZW-g_S_XfNQ7e' }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=ENVIRONMENT=production

      - name: Build Android App Bundle (Google Play Store AAB)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://flowspace-api.onrender.com/api/v1' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wltzqzmretyxbanmqjpa.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_4Mz3KRV6is5_R8edMVZW-g_S_XfNQ7e' }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=ENVIRONMENT=production

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowspace-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowspace-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  build_ios:
    name: Build iOS Package (macOS Runner)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, unsigned bundle)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://flowspace-api.onrender.com/api/v1' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wltzqzmretyxbanmqjpa.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_4Mz3KRV6is5_R8edMVZW-g_S_XfNQ7e' }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=ENVIRONMENT=production

      - name: Package iOS App to Payload Archive (.ipa format)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FlowSpace-ios-unsigned.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowspace-ios-unsigned-ipa
          path: FlowSpace-ios-unsigned.ipa
          retention-days: 14
